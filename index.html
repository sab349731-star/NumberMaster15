<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Master 15</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        h1 {
            margin-bottom: 5px;
            color: #4facfe;
        }
        .subtitle {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
            transition: 0.2s;
            margin: 5px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-secondary {
            background: #444;
            box-shadow: none;
        }

        /* WELCOME / LOADING SCREEN */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .welcome-title {
            font-size: 28px;
            font-weight: bold;
            color: #4facfe;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }
        .loading-bar-container {
            width: 80%;
            background: #33334d;
            border-radius: 15px;
            height: 15px;
            margin: 20px 0;
            overflow: hidden;
            border: 1px solid #4facfe;
        }
        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            transition: width 0.1s linear;
        }
        .loading-text {
            font-size: 16px;
            color: #b0b0b0;
            font-weight: bold;
        }
        
        /* Level Selection Screen */
        #level-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
        }
        .level-card {
            background: #33334d;
            border-radius: 12px;
            padding: 20px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }
        .level-card.unlocked {
            background: #3b3b5c;
            border-color: #4facfe;
            color: #fff;
        }
        .level-card.locked {
            background: #222233;
            color: #666;
            cursor: not-allowed;
            border-color: #333;
        }
        .level-card span.lock-icon {
            font-size: 12px;
            margin-top: 5px;
            color: #ff6b6b;
        }

        /* Game Play Screen */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .target-box {
            font-size: 24px;
            margin-bottom: 20px;
            background: #2a2a40;
            padding: 15px 30px;
            border-radius: 15px;
            border: 2px dashed #4facfe;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }
        .tile {
            background: #3a3a5e;
            height: 75px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .tile:active {
            transform: scale(0.92);
            background: #4facfe;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- WELCOME & LOADING SCREEN -->
        <div id="welcome-screen">
            <div class="welcome-title">Welcome to<br>Number Master 15</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <div class="loading-text" id="loadingText">Loading 0%</div>
        </div>

        <!-- LEVEL SELECTION SCREEN -->
        <div id="level-screen">
            <h1>Number Master 15</h1>
            <div class="subtitle">Select Your Level</div>
            <div class="levels-grid" id="levelsGrid"></div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen">
            <div class="game-info">
                <span id="levelTitle">Level 1</span>
                <span id="scoreDisplay">Score: 0</span>
            </div>
            <div class="target-box" id="targetDisplay">Target: 15</div>
            <div class="grid" id="numberGrid"></div>
            <button class="btn btn-secondary" onclick="backToLevels()">⬅ Levels</button>
        </div>
    </div>

    <script>
        const totalLevels = 15;
        let currentLevel = 1;
        let currentScore = 0;
        let targetNumber = 15;

        // Loading animation from 0 to 100%
        let loadProgress = 0;
        const loadingInterval = setInterval(() => {
            loadProgress += 2; // speed of loading
            if (loadProgress <= 100) {
                document.getElementById('loadingBar').style.width = loadProgress + '%';
                document.getElementById('loadingText').innerText = `Loading ${loadProgress}%`;
            } else {
                clearInterval(loadingInterval);
                // Switch from welcome screen to level selection screen
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('level-screen').style.display = 'flex';
                renderLevels();
            }
        }, 30); // smooth speed

        // Load progress from localStorage
        function getUnlockedLevel() {
            return parseInt(localStorage.getItem('nm15_unlocked') || '1');
        }

        function setUnlockedLevel(lvl) {
            let currentUnlocked = getUnlockedLevel();
            if (lvl > currentUnlocked) {
                localStorage.setItem('nm15_unlocked', lvl);
            }
        }

        // Render Level Selection Menu
        function renderLevels() {
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';
            let unlockedMax = getUnlockedLevel();

            for (let i = 1; i <= totalLevels; i++) {
                const card = document.createElement('div');
                card.classList.add('level-card');

                if (i <= unlockedMax) {
                    card.classList.add('unlocked');
                    card.innerHTML = `<div>${i}</div>`;
                    card.onclick = () => startLevel(i);
                } else {
                    card.classList.add('locked');
                    card.innerHTML = `<div>${i}</div><span class="lock-icon">🔒 Locked</span>`;
                }
                grid.appendChild(card);
            }
        }

        function startLevel(lvl) {
            currentLevel = lvl;
            currentScore = 0;
            targetNumber = 15 + (lvl - 1) * 5;

            document.getElementById('level-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('levelTitle').innerText = `Level ${lvl}`;
            document.getElementById('targetDisplay').innerText = `Target: ${targetNumber}`;

            generateGrid();
        }

        function backToLevels() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('level-screen').style.display = 'flex';
            renderLevels();
        }

        function generateGrid() {
            const grid = document.getElementById('numberGrid');
            grid.innerHTML = '';
            document.getElementById('scoreDisplay').innerText = `Score: ${currentScore}`;

            for (let i = 0; i < 9; i++) {
                const tile = document.createElement('div');
                let randomVal = Math.floor(Math.random() * 5) + 1;
                tile.classList.add('tile');
                tile.innerText = randomVal;
                tile.onclick = () => {
                    currentScore += randomVal;
                    document.getElementById('scoreDisplay').innerText = `Score: ${currentScore}`;
                    
                    if (currentScore === targetNumber) {
                        alert(`🎉 Level ${currentLevel} Completed!`);
                        setUnlockedLevel(currentLevel + 1);
                        backToLevels();
                    } else if (currentScore > targetNumber) {
                        alert(`❌ Oops! Score exceeded target. Try again!`);
                        startLevel(currentLevel);
                    }
                };
                grid.appendChild(tile);
            }
        }
    </script>
</body>
</html>
