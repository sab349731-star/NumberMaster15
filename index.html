<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Number Master 15</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0f172a;
      --board: #1e293b;
      --tile: #3b82f6;
      --tile-correct: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* CONFETTI CANVAS */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1500;
    }

    /* THREE DOTS MENU BUTTON */
    .top-menu-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--board);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .top-menu-btn:active { transform: scale(0.92); }

    /* DROPDOWN MENU */
    .dropdown-menu {
      position: fixed;
      top: 64px;
      right: 16px;
      background: var(--board);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      width: 200px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 950;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .menu-item {
      padding: 13px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: rgba(59, 130, 246, 0.2); }

    /* WELCOME & LOADING SCREEN */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
      text-align: center;
    }
    .welcome-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .loading-bar-container {
      width: 80%;
      max-width: 280px;
      background: var(--board);
      border-radius: 12px;
      height: 14px;
      margin: 15px 0;
      overflow: hidden;
      border: 1px solid #38bdf8;
    }
    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      transition: width 0.05s linear;
    }
    .loading-text {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 5px;
    }

    /* MODALS (LEVELS & BEST RECORDS) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: var(--board);
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: #38bdf8;
    }
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 15px;
      padding: 5px;
    }
    .level-card {
      background: #2a3b5c;
      border-radius: 10px;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .level-card.unlocked {
      background: #3b82f6;
      color: white;
    }
    .level-card.locked {
      background: #1e293b;
      color: var(--muted);
      cursor: not-allowed;
    }
    .level-card span.lock-text {
      font-size: 0.65rem;
      margin-top: 2px;
      color: #fca5a5;
    }
    .records-list {
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }
    .record-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    header { text-align: center; margin-bottom: 14px; }
    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5px; }
    .creator-name {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-top: 2px;
      font-weight: 600;
    }
    .level-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 800;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .level-badge:active { transform: scale(0.95); }
    .stats {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      justify-content: center;
    }
    .stat-box {
      background: var(--board);
      padding: 6px 14px;
      border-radius: 10px;
      min-width: 80px;
    }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .board-container {
      width: min(85vw, 340px);
      height: min(85vw, 340px);
      background: var(--board);
      padding: 8px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .board {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 6px;
    }
    .tile {
      background: var(--tile);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    }
    .tile:active { transform: scale(0.95); }
    .tile.correct { background: var(--tile-correct); }
    .tile.empty { background: transparent; box-shadow: none; cursor: default; }
    .tile.hint-highlight {
      box-shadow: 0 0 15px 4px #facc15;
      border: 2px solid #fef08a;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button.action-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }
    button.next-btn {
      background: #10b981;
      box-shadow: 0 4px 12px rgba(16,185,129,0.4);
      display: none;
    }
    button.reset-btn {
      background: #475569;
      box-shadow: none;
      font-size: 0.85rem;
      padding: 10px 14px;
    }
    button.close-modal-btn {
      background: #ef4444;
      margin-top: 10px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(239,68,68,0.3);
    }
    button:active { transform: scale(0.97); }
    .win-banner {
      margin-top: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #34d399;
      min-height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- CONFETTI CANVAS -->
  <canvas id="confetti-canvas"></canvas>

  <!-- THREE DOTS MENU BUTTON -->
  <button class="top-menu-btn" onclick="toggleDropdown()">⋮</button>

  <!-- DROPDOWN MENU -->
  <div class="dropdown-menu" id="dropdownMenu">
    <div class="menu-item" onclick="undoMove()">↩️ Undo Move</div>
    <div class="menu-item" onclick="showHint()">💡 Hint</div>
    <div class="menu-item" onclick="openRecordsModal()">🏆 Best Score</div>
    <div class="menu-item" onclick="toggleSound()" id="soundToggleText">🔊 Sound: ON</div>
  </div>

  <!-- WELCOME & LOADING SCREEN -->
  <div id="welcome-screen">
    <div class="welcome-title">Welcome to<br>Number Master 15</div>
    <div class="loading-bar-container">
      <div class="loading-bar" id="loadingBar"></div>
    </div>
    <div class="loading-text" id="loadingText">Loading 0%</div>
  </div>

  <!-- LEVEL SELECTION POPUP MODAL -->
  <div id="level-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">Select Level</div>
      <div class="levels-grid" id="levelsGrid"></div>
      <button class="action-btn close-modal-btn" onclick="closeModal('level-modal')">Close</button>
    </div>
  </div>

  <!-- BEST RECORDS MODAL -->
  <div id="records-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">🏆 Best Records</div>
      <div class="records-list" id="recordsList"></div>
      <button class="action-btn close-modal-btn" onclick="closeModal('records-modal')">Close</button>
    </div>
  </div>

  <header>
    <h1>Number Master 15</h1>
    <div class="creator-name">Created by Abdul Basit</div>
    <div class="level-badge" id="levelDisplay" onclick="openLevelModal()">Level 1</div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Moves</div>
        <div class="stat-val" id="moves">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Time</div>
        <div class="stat-val" id="timer">00:00</div>
      </div>
    </div>
  </header>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="win-banner" id="winBanner"></div>

  <div class="controls">
    <button class="action-btn" onclick="startLevel(currentLevel)">Restart</button>
    <button class="action-btn next-btn" id="nextBtn" onclick="nextLevel()">Next Level ➡️</button>
    <button class="action-btn reset-btn" onclick="resetProgress()">Reset All</button>
  </div>

  <script>
    // Smooth Loading Animation from 0 to 100%
    let loadProgress = 0;
    const loadingInterval = setInterval(() => {
      loadProgress += 2;
      if (loadProgress <= 100) {
        document.getElementById('loadingBar').style.width = loadProgress + '%';
        document.getElementById('loadingText').textContent = `Loading ${loadProgress}%`;
      } else {
        clearInterval(loadingInterval);
        const welcomeScreen = document.getElementById('welcome-screen');
        welcomeScreen.style.opacity = '0';
        welcomeScreen.style.transition = 'opacity 0.4s ease';
        setTimeout(() => {
          welcomeScreen.style.display = 'none';
        }, 400);
      }
    }, 25);

    // Sound System
    let soundEnabled = localStorage.getItem('nm_sound') !== 'false';
    let audioCtx = null;

    function updateSoundMenuText() {
      document.getElementById('soundToggleText').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    }
    updateSoundMenuText();

    function toggleSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem('nm_sound', soundEnabled);
      updateSoundMenuText();
      if (soundEnabled) playSound('click');
      closeDropdown();
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'move') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'click') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.04);
        } else if (type === 'win') {
          let now = audioCtx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            let o = audioCtx.createOscillator();
            let g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + i * 0.1);
            g.gain.setValueAtTime(0.2, now + i * 0.1);
            g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
            o.start(now + i * 0.1);
            o.stop(now + i * 0.1 + 0.2);
          });
        }
      } catch (e) {}
    }

    // Dropdown Logic
    const dropdownMenu = document.getElementById('dropdownMenu');
    function toggleDropdown() {
      playSound('click');
      dropdownMenu.style.display = dropdownMenu.style.display === 'flex' ? 'none' : 'flex';
    }
    function closeDropdown() {
      dropdownMenu.style.display = 'none';
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.top-menu-btn') && !e.target.closest('.dropdown-menu')) {
        closeDropdown();
      }
    });

    // Game Variables
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const winBanner = document.getElementById('winBanner');
    const levelDisplay = document.getElementById('levelDisplay');
    const nextBtn = document.getElementById('nextBtn');
    const levelModal = document.getElementById('level-modal');
    const levelsGrid = document.getElementById('levelsGrid');

    let currentLevel = parseInt(localStorage.getItem('nm_level')) || 1;
    let unlockedLevel = parseInt(localStorage.getItem('nm_unlocked')) || currentLevel;
    let size = 3;
    let tiles = [];
    let moveHistory = []; // For Undo feature
    let hintTileIndex = -1; // For Hint highlight
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let gameActive = false;
    const totalLevels = 15;

    function getLevelConfig(lvl) {
      if (lvl === 1) return { grid: 3, shuffleMoves: 6 };
      if (lvl === 2) return { grid: 3, shuffleMoves: 15 };
      if (lvl === 3) return { grid: 3, shuffleMoves: 35 };
      if (lvl === 4) return { grid: 4, shuffleMoves: 20 };
      if (lvl === 5) return { grid: 4, shuffleMoves: 45 };
      if (lvl === 6) return { grid: 4, shuffleMoves: 80 };
      return { grid: 5, shuffleMoves: 60 + (lvl * 10) };
    }

    function formatTime(s) {
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function isSolved(arr) {
      let total = size * size;
      for (let i = 0; i < total - 1; i++) {
        if (arr[i] !== i + 1) return false;
      }
      return arr[total - 1] === 0;
    }

    function startLevel(lvl) {
      stopTimer();
      stopConfetti();
      seconds = 0;
      moves = 0;
      moveHistory = [];
      hintTileIndex = -1;
      movesEl.textContent = '0';
      timerEl.textContent = '00:00';
      winBanner.textContent = '';
      nextBtn.style.display = 'none';
      gameActive = true;

      currentLevel = lvl;
      localStorage.setItem('nm_level', currentLevel);

      const config = getLevelConfig(lvl);
      size = config.grid;
      levelDisplay.textContent = `Level ${lvl} (${size}x${size})`;

      boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;

      let total = size * size;
      tiles = [];
      for (let i = 1; i < total; i++) tiles.push(i);
      tiles.push(0);

      let lastEmpty = -1;
      for (let step = 0; step < config.shuffleMoves; step++) {
        const emptyIdx = tiles.indexOf(0);
        const r = Math.floor(emptyIdx / size);
        const c = emptyIdx % size;
        const neighbors = [];
        if (r > 0) neighbors.push(emptyIdx - size);
        if (r < size - 1) neighbors.push(emptyIdx + size);
        if (c > 0) neighbors.push(emptyIdx - 1);
        if (c < size - 1) neighbors.push(emptyIdx + 1);

        const validNeighbors = neighbors.filter(n => n !== lastEmpty);
        const pick = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
        lastEmpty = emptyIdx;
        [tiles[emptyIdx], tiles[pick]] = [tiles[pick], tiles[emptyIdx]];
      }

      if (isSolved(tiles)) {
        [tiles[total - 1], tiles[total - 2]] = [tiles[total - 2], tiles[total - 1]];
      }

      render();
    }

    function render() {
      boardEl.innerHTML = '';
      let fontSize = size === 3 ? '1.8rem' : size === 4 ? '1.4rem' : '1.1rem';
      tiles.forEach((num, idx) => {
        const div = document.createElement('div');
        if (num === 0) {
          div.className = 'tile empty';
        } else {
          div.className = 'tile' + (num === idx + 1 ? ' correct' : '') + (idx === hintTileIndex ? ' hint-highlight' : '');
          div.textContent = num;
          div.style.fontSize = fontSize;
          div.onclick = () => moveTile(idx);
        }
        boardEl.appendChild(div);
      });
    }

    function moveTile(idx) {
      if (!gameActive) return;
      const emptyIdx = tiles.indexOf(0);
      const r1 = Math.floor(idx / size), c1 = idx % size;
      const r2 = Math.floor(emptyIdx / size), c2 = emptyIdx % size;

      if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
        if (moves === 0) startTimer();
        
        // Save state for Undo
        moveHistory.push([...tiles]);
        hintTileIndex = -1;

        [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
        moves++;
        movesEl.textContent = moves;
        playSound('move');
        render();

        if (isSolved(tiles)) {
          gameActive = false;
          stopTimer();
          playSound('win');
          startConfetti();
          saveBestRecord(currentLevel, moves, seconds);
          winBanner.textContent = `🎉 زبردست! Level ${currentLevel} مکمل ہو گیا!`;
          nextBtn.style.display = 'inline-block';

          if (currentLevel >= unlockedLevel && currentLevel < totalLevels) {
            unlockedLevel = currentLevel + 1;
            localStorage.setItem('nm_unlocked', unlockedLevel);
          }
        }
      }
    }

    // Undo Feature
    function undoMove() {
      closeDropdown();
      if (!gameActive || moveHistory.length === 0) {
        playSound('click');
        return;
      }
      tiles = moveHistory.pop();
      moves = Math.max(0, moves - 1);
      movesEl.textContent = moves;
      hintTileIndex = -1;
      playSound('move');
      render();
    }

    // Hint Feature (Finds a valid move that improves Manhattan distance)
    function showHint() {
      closeDropdown();
      if (!gameActive) return;
      playSound('click');
      const emptyIdx = tiles.indexOf(0);
      const r = Math.floor(emptyIdx / size);
      const c = emptyIdx % size;
      const neighbors = [];
      if (r > 0) neighbors.push(emptyIdx - size);
      if (r < size - 1) neighbors.push(emptyIdx + size);
      if (c > 0) neighbors.push(emptyIdx - 1);
      if (c < size - 1) neighbors.push(emptyIdx + 1);

      let bestNeighbor = neighbors[0];
      let bestImprovement = -999;

      neighbors.forEach(nIdx => {
        let val = tiles[nIdx];
        let targetIdx = val - 1;
        let currDist = Math.abs(Math.floor(nIdx / size) - Math.floor(targetIdx / size)) + Math.abs((nIdx % size) - (targetIdx % size));
        let newDist = Math.abs(Math.floor(emptyIdx / size) - Math.floor(targetIdx / size)) + Math.abs((emptyIdx % size) - (targetIdx % size));
        let improvement = currDist - newDist;
        if (improvement > bestImprovement) {
          bestImprovement = improvement;
          bestNeighbor = nIdx;
        }
      });

      hintTileIndex = bestNeighbor;
      render();
    }

    // Best Score / Records System
    function saveBestRecord(lvl, m, s) {
      let records = JSON.parse(localStorage.getItem('nm_records') || '{}');
      if (!records[lvl] || m < records[lvl].moves || (m === records[lvl].moves && s < records[lvl].time)) {
        records[lvl] = { moves: m, time: s };
        localStorage.setItem('nm_records', JSON.stringify(records));
      }
    }

    function openRecordsModal() {
      closeDropdown();
      playSound('click');
      const list = document.getElementById('recordsList');
      list.innerHTML = '';
      let records = JSON.parse(localStorage.getItem('nm_records') || '{}');

      for (let i = 1; i <= totalLevels; i++) {
        const row = document.createElement('div');
        row.className = 'record-row';
        if (records[i]) {
          row.innerHTML = `<span><strong>Level ${i}</strong></span><span>${records[i].moves} Moves | ${formatTime(records[i].time)}</span>`;
        } else {
          row.innerHTML = `<span style="color:var(--muted)">Level ${i}</span><span style="color:var(--muted)">--</span>`;
        }
        list.appendChild(row);
      }
      document.getElementById('records-modal').style.display = 'flex';
    }

    function nextLevel() {
      playSound('move');
      if (currentLevel < totalLevels) {
        startLevel(currentLevel + 1);
      } else {
        alert('🎉 آپ نے تمام لیولز مکمل کر لیے ہیں!');
      }
    }

    function resetProgress() {
      if (confirm('کیا آپ دوبارہ Level 1 سے شروع کرنا چاہتے ہیں؟')) {
        currentLevel = 1;
        unlockedLevel = 1;
        localStorage.setItem('nm_level', 1);
        localStorage.setItem('nm_unlocked', 1);
        startLevel(1);
      }
    }

    function openLevelModal() {
      playSound('click');
      levelsGrid.innerHTML = '';
      unlockedLevel = parseInt(localStorage.getItem('nm_unlocked')) || 1;

      for (let i = 1; i <= totalLevels; i++) {
        const card = document.createElement('div');
        card.className = 'level-card';
        if (i <= unlockedLevel) {
          card.classList.add('unlocked');
          card.innerHTML = `<div>Level ${i}</div>`;
          card.onclick = () => {
            closeModal('level-modal');
            startLevel(i);
          };
        } else {
          card.classList.add('locked');
          card.innerHTML = `<div>Level ${i}</div><span class="lock-text">🔒 Locked</span>`;
        }
        levelsGrid.appendChild(card);
      }
      levelModal.style.display = 'flex';
    }

    function closeModal(id) {
      playSound('click');
      document.getElementById(id).style.display = 'none';
    }

    // Confetti Celebration Engine
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnim = null;

    function startConfetti() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      confettiParticles = [];
      const colors = ['#38bdf8', '#10b981', '#f59e0b', '#ec4899', '#a855f7'];
      for (let i = 0; i < 80; i++) {
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 10 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10 - 10
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiParticles.forEach(p => {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.r, p.r * 1.5);
        p.y += Math.cos(p.d) + 3;
        p.x += Math.sin(p.d) * 1.5;
        if (p.y > canvas.height) {
          p.y = -10;
          p.x = Math.random() * canvas.width;
        }
      });
      confettiAnim = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      if (confettiAnim) cancelAnimationFrame(confettiAnim);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    startLevel(currentLevel);
  </script>
</body>
</html>
