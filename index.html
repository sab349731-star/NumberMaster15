<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NumberMaster Multi-Level</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0f172a;
      --board: #1e293b;
      --tile: #3b82f6;
      --tile-correct: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    header { text-align: center; margin-bottom: 14px; }
    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.5px; }
    .levels {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      justify-content: center;
    }
    .level-btn {
      background: #334155;
      color: var(--muted);
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .level-btn.active {
      background: #3b82f6;
      color: white;
    }
    .stats {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      justify-content: center;
    }
    .stat-box {
      background: var(--board);
      padding: 6px 14px;
      border-radius: 10px;
      min-width: 80px;
    }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .stat-val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }
    .board-container {
      width: min(85vw, 340px);
      height: min(85vw, 340px);
      background: var(--board);
      padding: 8px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .board {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 6px;
    }
    .tile {
      background: var(--tile);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      box-shadow: 0 3px 0 rgba(0,0,0,0.2);
    }
    .tile:active { transform: scale(0.95); }
    .tile.correct { background: var(--tile-correct); }
    .tile.empty { background: transparent; box-shadow: none; cursor: default; }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    button.action-btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99,102,241,0.4);
    }
    button.action-btn:active { transform: scale(0.97); }
    .win-banner {
      margin-top: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #34d399;
      min-height: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>NumberMaster</h1>
    <div class="levels">
      <button class="level-btn active" onclick="setGridSize(3, this)">Easy (3x3)</button>
      <button class="level-btn" onclick="setGridSize(4, this)">Medium (4x4)</button>
      <button class="level-btn" onclick="setGridSize(5, this)">Hard (5x5)</button>
    </div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Moves</div>
        <div class="stat-val" id="moves">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Time</div>
        <div class="stat-val" id="timer">00:00</div>
      </div>
    </div>
  </header>

  <div class="board-container">
    <div class="board" id="board"></div>
  </div>

  <div class="win-banner" id="winBanner"></div>

  <div class="controls">
    <button class="action-btn" onclick="newGame()">New Game</button>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const winBanner = document.getElementById('winBanner');

    let size = 3;
    let tiles = [];
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let gameActive = false;

    function setGridSize(s, btn) {
      document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      size = s;
      boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;
      newGame();
    }

    function formatTime(s) {
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const sec = String(s % 60).padStart(2, '0');
      return `${m}:${sec}`;
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        seconds++;
        timerEl.textContent = formatTime(seconds);
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function isSolvable(arr, n) {
      let inv = 0;
      let len = arr.length;
      let emptyRow = 0;
      for (let i = 0; i < len; i++) {
        if (arr[i] === 0) {
          emptyRow = Math.floor(i / n);
          continue;
        }
        for (let j = i + 1; j < len; j++) {
          if (arr[j] !== 0 && arr[i] > arr[j]) inv++;
        }
      }
      if (n % 2 !== 0) {
        return inv % 2 === 0;
      } else {
        if ((n - emptyRow) % 2 !== 0) {
          return inv % 2 === 0;
        } else {
          return inv % 2 !== 0;
        }
      }
    }

    function isSolved(arr) {
      let total = size * size;
      for (let i = 0; i < total - 1; i++) {
        if (arr[i] !== i + 1) return false;
      }
      return arr[total - 1] === 0;
    }

    function newGame() {
      stopTimer();
      seconds = 0;
      moves = 0;
      movesEl.textContent = '0';
      timerEl.textContent = '00:00';
      winBanner.textContent = '';
      gameActive = true;

      boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;

      let total = size * size;
      do {
        tiles = [];
        for (let i = 1; i < total; i++) tiles.push(i);
        tiles.push(0);

        for (let i = tiles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }
      } while (!isSolvable(tiles, size) || isSolved(tiles));

      render();
    }

    function render() {
      boardEl.innerHTML = '';
      let fontSize = size === 3 ? '1.8rem' : size === 4 ? '1.4rem' : '1.1rem';
      tiles.forEach((num, idx) => {
        const div = document.createElement('div');
        if (num === 0) {
          div.className = 'tile empty';
        } else {
          div.className = 'tile' + (num === idx + 1 ? ' correct' : '');
          div.textContent = num;
          div.style.fontSize = fontSize;
          div.onclick = () => moveTile(idx);
        }
        boardEl.appendChild(div);
      });
    }

    function moveTile(idx) {
      if (!gameActive) return;
      const emptyIdx = tiles.indexOf(0);
      const r1 = Math.floor(idx / size), c1 = idx % size;
      const r2 = Math.floor(emptyIdx / size), c2 = emptyIdx % size;

      if (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1) {
        if (moves === 0) startTimer();
        [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
        moves++;
        movesEl.textContent = moves;
        render();

        if (isSolved(tiles)) {
          gameActive = false;
          stopTimer();
          winBanner.textContent = `🎉 زبردست! آپ نے جیت لیا (${moves} چالیں)`;
        }
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    newGame();
  </script>
</body>
</html>
